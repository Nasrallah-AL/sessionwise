name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the built CLI
        run: |
          node dist/cli.js --help > /dev/null
          node dist/cli.js scan --adapter file --file examples/events.jsonl > /dev/null
          node dist/cli.js dashboard --adapter file --file examples/events.jsonl --out /tmp/sessionwise-report.html
          test -s /tmp/sessionwise-report.html

  # Single status for branch rules to require, so the matrix can change without editing the ruleset.
  ci-ok:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success"
